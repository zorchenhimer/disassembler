// Only single-line comments for now.
// Key Value pairs in each block
// Value types: string, bool, integer (hex with $ or 0x prefix,
// decimal otherwise), and other blocks.  Booleans don't have a
// true/false value. If the key is present, it is true.  False
// if it is not present or commented out.
//
// Warn when Banks overlap other Banks.
//
// Label, Range, and Window lists are optional inside blocks.

Global {
    // Default input file.  Bank blocks can override this.
    Input     "testdata/StudyBox.bin"

    // Mesen Label file
    MlbOutput "testdata/StudyBox.mlb"

    // 6502: Official instructions only
    // Full6502: Include unofficial instructions
    // SBX: StudyBox tape script
    Architecture 6502

    // Verbosity level for comments.  Default to standard
    // none: omit all comments
    // standard: output comments defined in labels and ranges
    // full: standard + byte output for every line.
    Comments full

    // Included files only contain Bank blocks.
    //Include "sbx_bank01.cfg"
    //Include "sbx_fixed.cfg"

    // This would be the "mapper configuration".  Basically, define window locations
    // and their sizes.  Banks mapped into these would have their labels available to
    // the bank currently being disassembled.
    // This functionality removes the need to specify indivual banks as "Global" (like
    // the fixed bank at $C000).
    // Auto labels will be generated across banks, if applicable.
    Windows [
        // Not entirely sure how well banked RAM would work with this.
        { Name "ram_4400"; Start $4400; Size $0C00; Init "static_4400"; }
        { Name "ram_a";    Start $5000; Size $1000; }
        { Name "ram_b";    Start $6000; Size $2000; }

        {
            // Use Name or Start when referencing windows in banks.
            Name  "prg_low"
            Start $8000

            Size  $4000

            // Initial bank to swap in when starting disassembly.  Not including
            // this will not map anything into this window at the start.
            Init "bank_01"
        }

        { Name "prg_fixed"; Start $C000; Size $4000; Init "bank_fixed"; }
    ]

    // Available to all banks.  Ideally, used for system ram and registers.
    Labels [
        { Address $30; Name "Argument_A"; Size 2; }
        { Address $32; Name "Argument_B"; Size 2; }
        { Address $34; Name "Argument_C"; Size 2; }
        { Address $36; Name "Argument_D"; Size 2; }
        { Address $38; Name "Argument_E"; Size 2; }
        { Address $3A; Name "Argument_F"; Size 2; }
        { Address $3C; Name "Argument_G"; Size 2; }

        { Address $2000; Name "PpuControl_2000"; }
        { Address $2001; Name "PpuMask_2001"; }
        { Address $2002; Name "PpuStatus_2002"; }
        { Address $2003; Name "OamAddr_2003"; }
        { Address $2004; Name "OamData_2004"; }
        { Address $2005; Name "PpuScroll_2005"; }
        { Address $2006; Name "PpuAddr_2006"; }
        { Address $2007; Name "PpuData_2007"; }

        { Address $4200; Name "SBX_4200"; }
        { Address $4201; Name "SBX_4201"; }
        { Address $4202; Name "SBX_4202"; }
    ]
}

Bank {
    Name    "bank_fixed" // will be auto-generated if missing
    Output  "testdata/bank_00.asm" // will warn if missing
    Offset  $0000 // default to $0000
    Address $C000 // required

    // default is "up to $1_0000" or the end of data, whichever comes first.
    // Warn if decoding address goes above $FFFF and stop dissassembly.
    Size    $4000

    // Required fields: Address, Name or Comment
    // Labels with a comment but no name will create an anonymous label.  If
    // that anon label is not referenced anywhere only the comment will be output.
    Labels [
        { Address $C000
          Name    "Handler_FE_DrawCharacter"
          Comment "Draws a character from the SBX ROM's charset." }

        { Address $CF4C
          Name    "Handler_AA_LongJump"

          // Ignore preceding spaces
          Comment "Bank in ArgA.
                   Destination in Word_4E.
                   Does not store a return address."
        }

        // Semicolons only required when more than one thing is on a line
        { Address $CF5C; Name "LCF5C"; Comment "script long jump??"; }
        { Address $C047; Name "Some_Label"; Comment "yup"; }
    ]

    // Required fields: Address, Size/End
    Ranges [
        {
            // Alias: Start
            Address $D2A9

            // Size or End, but not both.
            Size 8
            //End $D2B1

            // dec/decimal, bin/binary, hex/hexadecimal
            Display decimal

            // Bytes and Words will display raw values of either 8 or 16 bits
            // wide.  Labels will write a label for each entry, creating
            // autolabels when necessary.
            // Defaults to Bytes
            Type bytes

            // RTS trick labels (ie, SomeLabel-1).  Requires "Type label"
            //RTSLabels false

            // Max number of values to display grouped on a line.
            Stride 4

            // Create label with these values.  Note that the created label
            // will have the same size as the range.  Other defined labels
            // cannot overlap.
            Name "tbl_D2A9"
            // This will always be a CommentBlock
            Comment "Table of 8 bytes"
        }
    ]

    Windows [
        // When decoding from CPU address $C000 (ie, beginning of this PRG bank),
        // include labels defined in bank_01.
        { Address $C000; Window "prg_low"; Bank "bank_01"; }

        // When address $D123 is reached, switch the included labels from the ones
        // defined in bank_01 to the ones defined in bank_02
        { Address $D123; Window "prg_low"; Bank "bank_02"; }
    ]
}

Bank {
    Name    "bank_01"
    Output  "testdata/bank_01.asm"
    Offset  $4000
    Address $8000
    Size    $4000

    Windows [
        { Address $8000; Window "prg_low"; Bank "bank_01"; }
        { Address $8000; Window "prg_fixed"; Bank "bank_fixed"; }
    ]

    Labels [
        { Address $8186; name "VMCodeLoop"; }

        // Newlines in comments can either be a raw newline or "\n"
        { Address $8375; name "Handler_CC_Subtract";
          comment "Subtract Argument_B from Argument_A\nResult in Argument_A"; }
    ]

    Ranges [
        { Address $B166; end $B1FF; type Bytes; } // all $FF
        { Address $B200; end $B210; type Bytes; } // unsure
        { Address $B291; end $B390; type Words; } // Table_Handlers
        { Address $B211; end $B290; type Bytes; } // Table_BytecodeMetadata
        { Address $B391; end $B3AE; type Bytes; } // related to Handler_DD
        { Address $B3AF; end $B43E; type Bytes; } // Table_73AF_NoteTable; verify size
        { Address $B43F; end $B448; type Bytes; } // Table_743F
        { Address $B449; end $B44F; type Bytes; } // Table_7449
        { Address $B450; end $B454; type Bytes; } // Table_7450
        { Address $B599; end $BFFF; type Bytes; stride 16; } // all $FF
    ]
}
// No code is disassembled here.  Output file will only contain variable definitions.
// Block is optional
Bank {
    Name   "static_4400"
    Input  "-" // No input.  Treat as a RAM bank.
    Output "testdata/staic_4400.asm"

    Address $4400
    Size    $0C00
    // Offset used for MLB address calculation.  Otherwise, unused for RAM
    // banks.
    Offset  $0400

    Labels [
        { Address $440A; name "var_440A"; }
        {
            Address $4423
            Name "ExpansionControllerPresent"
            Comment "Set to $FF when an expansion controller is present.
                     Other non-zero values seem to be possible."
        }
    ]

    // Ranges and Windows are not used in RAM banks.
}
