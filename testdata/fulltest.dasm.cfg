global {
	input "fulltest.bin"
	comments full
	output "fulltest-global.dasm.asm"

    AsmWidth 20
    CommentWidth 0
	autovars true

	Windows [
		{ Name "main"; start $8000; size $8000; init "bank_main"; }
	]
}

bank {
	address $8000;
	name "bank_main"
	output "fulltest.dasm.asm"

	labels [
		{ address $8017; name "Instr_ADC"; ci "adc has 8 opcodes\nline two" }
		{ address $802A; name "Instr_AND"; }
		{ address $803D; name "Instr_ASL"; }
		{ address $8048; name "Instr_Branches"; }
		{ address $8058; name "Instr_BIT"; }
		{ address $805D; name "Instr_Implied"; }
		{ address $8074; name "Instr_CMP"; }
		{ address $8087; name "Instr_CPX"; }
		{ address $808E; name "Instr_CPY"; }
		{ address $8095; name "Instr_DEC"; }
		{ address $809F; name "Instr_EOR"; }
		{ address $80B2; name "Instr_INC"; }
		{ address $80BC; name "Instr_JMP"; }
		{ address $80CB; name "Instr_JSR"; }
		//{ address $80CE; name "what"; }
		{ address $80D4; name "Instr_LDA"; }
		{ address $80E7; name "Instr_LDX"; }
		{ address $80F3; name "Instr_LDY"; }
		{ address $80FF; name "Instr_LSR"; }
		{ address $810A; name "Instr_ORA"; }
		{ address $811D; name "Instr_ROL"; }
		{ address $8128; name "Instr_ROR"; }
		{ address $8133; name "Instr_SBC"; }
		{ address $8146; name "Instr_STA"; }
		{ address $8157; name "Instr_STX"; }
		{ address $815E; name "Instr_STY"; }

		{ address $8165; name "Routine"; ParamSize 3; }
		{ address $817C; name "ArgAddr"; size 2; }
        { address $806C; name "after_rts"; }
        //{ address $8181; name "ArgHigh"; }
        { address $8182; name "ArgLow"; }
        { address $8180; name ":"; }
        { address $8183; name ":"; cb "unused anon" }
	]

	ranges [
		{ start $8000; end $8016; name "Ascii"; }
		{ start $8186; end $BFFF; Name "filler"; }
	]
}
