global {
	input "fulltest.bin"
	comments full
	output "fulltest-global.dasm.asm"

	autovars true

	Windows [
		{ Name "main"; start $8000; size $8000; init "bank_main"; }
	]
}

bank {
	address $8000;
	name "bank_main"
	output "fulltest.dasm.asm"

	labels [
		{ address $8017; name "Instr_ADC"; }
		{ address $802A; name "Instr_AND"; }
		{ address $803D; name "Instr_ASL"; }
		{ address $8048; name "Instr_Branches"; }
		{ address $8058; name "Instr_BIT"; }
		{ address $805D; name "Instr_Implied"; }
		{ address $8074; name "Instr_CMP"; }
		{ address $8087; name "Instr_CPX"; }
		{ address $808E; name "Instr_CPY"; }
		{ address $8095; name "Instr_DEC"; }
		{ address $809F; name "Instr_EOR"; }
		{ address $80B2; name "Instr_INC"; }
		{ address $80BC; name "Instr_JMP"; }
		{ address $80CE; name "Instr_JSR"; }
		{ address $80D7; name "Instr_LDA"; }
		{ address $80EA; name "Instr_LDX"; }
		{ address $80F6; name "Instr_LDY"; }
		{ address $8102; name "Instr_LSR"; }
		{ address $810D; name "Instr_ORA"; }
		{ address $8120; name "Instr_ROL"; }
		{ address $812B; name "Instr_ROR"; }
		{ address $8136; name "Instr_SBC"; }
		{ address $8149; name "Instr_STA"; }
		{ address $815A; name "Instr_STX"; }
		{ address $8161; name "Instr_STY"; }

		{ address $8168; name "Routine"; ParamSize 3; }
		{ address $817E; name "ArgAddr"; size 2; }
	]

	ranges [
		{ start $8000; end $8016; }
		{ start $8187; end $BFFF; Name "filler"; }
	]
}
