MEMORY {
    ZP:     start = $00,    size = $0100, type = rw, file = "";
    RAM:    start = $0700,  size = $0100, type = rw, file = "";

    PRG:   start = $8000,  size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
	ZP:   load = ZP, type = zp;
	RAM:  load = RAM, type = bss;
	CODE: load = PRG, type ro, start = $8000;
}
